name: Publish PyPI package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or commit to publish
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - name: Reject the non-functional PyPI reservation
        run: |
          python - <<'PY'
          import pathlib, re
          text = pathlib.Path("python/jouzu/pyproject.toml").read_text()
          version = re.search(r'^version = "([^"]+)"$', text, re.MULTILINE).group(1)
          if version == "0.0.1":
              raise SystemExit("PyPI 0.0.1 is a reservation and must not be republished for the npm-only v0.1 release")
          PY
      - run: uv build --project python/jouzu --out-dir dist/python
      - run: uvx --from twine twine check dist/python/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-dist
          path: dist/python/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist/
