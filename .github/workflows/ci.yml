name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
        timeout-minutes: 20
      - run: npm run build
        timeout-minutes: 15
      - run: npm run check
        timeout-minutes: 10
      - run: npm test --workspaces --if-present
        timeout-minutes: 20
      - if: matrix.node == 24
        run: npm run pack:check
        timeout-minutes: 10
      - if: matrix.node == 24
        run: npm run test:packed
        timeout-minutes: 20
      - if: matrix.node == 24
        run: npm run test:auto-update
        timeout-minutes: 20
      - if: matrix.node == 24
        run: npm run test:extensions:online
        timeout-minutes: 15
        env:
          JOUZU_EXTENSION_NETWORK: "1"

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - run: uv run --project python/jouzu --python ${{ matrix.python }} python -m unittest discover -s python/jouzu/tests -v
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv build --project python/jouzu --out-dir dist/python
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uvx --from twine twine check dist/python/*
