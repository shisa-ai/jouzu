name: CI

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to test
        type: choice
        options: [windows, all]
        default: windows
      npm-cache:
        description: Restore downloaded npm archives (cold skips restoration)
        type: choice
        options: [warm, cold]
        default: warm
      fixture-drive:
        description: Windows fixture volume (runner uses the default temp directory)
        type: choice
        options: [runner, C, D]
        default: runner
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
        node: [22, 24]
        exclude:
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Windows fixture and npm paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-ci-paths.ps1
        env:
          JOUZU_CI_FIXTURE_DRIVE: ${{ inputs.fixture-drive || 'runner' }}
          JOUZU_CI_NPM_CACHE: ${{ inputs.npm-cache || 'warm' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ runner.os != 'Windows' && 'npm' || '' }}
      - name: Restore Windows npm archives
        if: runner.os == 'Windows' && inputs.npm-cache != 'cold'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/jouzu-npm-cache
          key: windows-npm-${{ hashFiles('package-lock.json', 'packages/cli/package-lock.json', 'packages/cli/camoufox-runtime/package-lock.json') }}-${{ github.job }}-${{ matrix.node }}
          restore-keys: |
            windows-npm-${{ hashFiles('package-lock.json', 'packages/cli/package-lock.json', 'packages/cli/camoufox-runtime/package-lock.json') }}-
            windows-npm-
      - name: Test Windows Defender exclusion handling
        if: matrix.os == 'windows-latest' && matrix.node == 24
        shell: pwsh
        run: |
          ./scripts/windows-ci-paths.test.ps1
          ./scripts/windows-ci-defender.test.ps1
      - name: Record and configure Windows Defender
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 2
        run: ./scripts/windows-ci-defender.ps1 setup
      - run: node scripts/install-source-dependencies.mjs
        timeout-minutes: 20
      - run: npm run build
        env:
          JOUZU_BUILD_SOURCE_ONLY: "1"
        timeout-minutes: 15
      - run: npm run check
        timeout-minutes: 10
      - run: npm test --workspaces --if-present
        timeout-minutes: 20
      - if: matrix.os == 'windows-latest'
        name: Verify early-failure extension cleanup
        run: node --test packages/cli/test/release-extension-behavior.test.mjs
        timeout-minutes: 5
        env:
          JOUZU_TEST_EXTENSION_EARLY_FAILURE: "1"
      - if: matrix.node == 24
        run: npm run test:extensions:online
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOUZU_EXTENSION_NETWORK: "1"
      - name: Remove Windows Defender exclusions
        if: always() && (matrix.os == 'windows-latest')
        shell: pwsh
        timeout-minutes: 2
        run: ./scripts/windows-ci-defender.ps1 cleanup
      - name: Save Windows Defender state
        if: always() && (matrix.os == 'windows-latest')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-defender-node-${{ matrix.node }}
          path: ${{ runner.temp }}/jouzu-defender.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save Windows npm timings
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-npm-${{ github.job }}-${{ matrix.node }}
          path: ${{ runner.temp }}/jouzu-npm-logs
          if-no-files-found: warn
          retention-days: 7

  legacy-linux-static-fetch:
    if: inputs.platform != 'windows'
    runs-on: ubuntu-latest
    container: rockylinux:8@sha256:9794037624aaa6212aeada1d28861ef5e0a935adaf93e4ef79837119f2a2d04c
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24"]
    steps:
      - name: Install Git in the minimal baseline image
        run: dnf install -y -q git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify glibc support floor
        run: test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
      - run: npm ci --ignore-scripts
        timeout-minutes: 15
      - run: npm run build
        timeout-minutes: 10
      - name: Load release-owned dependencies without Camoufox
        run: node --test packages/cli/test/release-extensions.test.mjs
        timeout-minutes: 5
      - name: Verify the default installation excludes Camoufox
        shell: bash
        run: |
          test ! -e packages/cli/node_modules/@the-forge-flow/camoufox-pi
          test ! -e packages/cli/node_modules/camoufox-js
          test ! -e packages/cli/node_modules/pi-webaio/node_modules/playwright
          test ! -e packages/cli/node_modules/ua-parser-js
          PI_OFFLINE=1 JOUZU_HOME="$RUNNER_TEMP/jouzu-default" \
            node packages/cli/dist/cli.js doctor >doctor.txt
          grep -F "Optional Camoufox runtime: not installed; installs on first browser tool use" doctor.txt
        timeout-minutes: 5

  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        timeout-minutes: 20
      - run: npm run build
        timeout-minutes: 15
      - run: npm run check
        timeout-minutes: 10
      - run: npm test --workspaces --if-present
        timeout-minutes: 20
      - run: npm run test:extensions:online
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOUZU_EXTENSION_NETWORK: "1"
      - run: npm run pack:prepare:ci
        timeout-minutes: 10
      - run: npm run pack:check
        timeout-minutes: 5
        env:
          JOUZU_PACK_METADATA: dist/ci-artifacts/pack-metadata.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jouzu-candidate
          path: |
            dist/ci-artifacts/candidate.tgz
            dist/ci-artifacts/pack-metadata.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jouzu-updater
          path: |
            dist/ci-artifacts/candidate.tgz
            dist/ci-artifacts/next.tgz
            dist/ci-artifacts/broken.tgz
            dist/ci-artifacts/artifacts.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  optional-camoufox:
    needs: release-artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Windows fixture and npm paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-ci-paths.ps1
        env:
          JOUZU_CI_FIXTURE_DRIVE: ${{ inputs.fixture-drive || 'runner' }}
          JOUZU_CI_NPM_CACHE: ${{ inputs.npm-cache || 'warm' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Restore Windows npm archives
        if: runner.os == 'Windows' && inputs.npm-cache != 'cold'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/jouzu-npm-cache
          key: windows-npm-${{ hashFiles('package-lock.json', 'packages/cli/package-lock.json', 'packages/cli/camoufox-runtime/package-lock.json') }}-${{ github.job }}-${{ 'default' }}
          restore-keys: |
            windows-npm-${{ hashFiles('package-lock.json', 'packages/cli/package-lock.json', 'packages/cli/camoufox-runtime/package-lock.json') }}-
            windows-npm-
      - name: Record and configure Windows Defender
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 2
        run: ./scripts/windows-ci-defender.ps1 setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jouzu-candidate
          path: dist/ci-artifacts
      - name: Install and exercise the first-use browser runtime
        run: node scripts/test-packed-camoufox.mjs
        timeout-minutes: 25
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOUZU_PACKED_TARBALL: dist/ci-artifacts/candidate.tgz
      - name: Remove Windows Defender exclusions
        if: always() && (matrix.os == 'windows-latest')
        shell: pwsh
        timeout-minutes: 2
        run: ./scripts/windows-ci-defender.ps1 cleanup
      - name: Save Windows Defender state
        if: always() && (matrix.os == 'windows-latest')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-defender-optional-camoufox
          path: ${{ runner.temp }}/jouzu-defender.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save Windows npm timings
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-npm-${{ github.job }}-${{ 'default' }}
          path: ${{ runner.temp }}/jouzu-npm-logs
          if-no-files-found: warn
          retention-days: 7

  packed-install:
    needs: release-artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
        scope: [local, npm-exec, global]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Windows fixture and npm paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-ci-paths.ps1
        env:
          JOUZU_CI_FIXTURE_DRIVE: ${{ inputs.fixture-drive || 'runner' }}
          JOUZU_CI_NPM_CACHE: ${{ inputs.npm-cache || 'warm' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Restore Windows npm archives
        if: runner.os == 'Windows' && inputs.npm-cache != 'cold'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/jouzu-npm-cache
          key: windows-npm-${{ hashFiles('package-lock.json', 'packages/cli/package-lock.json', 'packages/cli/camoufox-runtime/package-lock.json') }}-${{ github.job }}-${{ matrix.scope }}
          restore-keys: |
            windows-npm-${{ hashFiles('package-lock.json', 'packages/cli/package-lock.json', 'packages/cli/camoufox-runtime/package-lock.json') }}-
            windows-npm-
      - name: Record and configure Windows Defender
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 2
        run: ./scripts/windows-ci-defender.ps1 ${{ matrix.scope == 'global' && 'scanned' || 'setup' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jouzu-candidate
          path: dist/ci-artifacts
      - run: npm run test:packed
        timeout-minutes: 35
        env:
          JOUZU_PACKED_SCOPE: ${{ matrix.scope }}
          JOUZU_PACKED_TARBALL: dist/ci-artifacts/candidate.tgz
      - name: Remove Windows Defender exclusions
        if: always() && (matrix.os == 'windows-latest')
        shell: pwsh
        timeout-minutes: 2
        run: ./scripts/windows-ci-defender.ps1 cleanup
      - name: Save Windows Defender state
        if: always() && (matrix.os == 'windows-latest')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-defender-packed-install-${{ matrix.scope }}
          path: ${{ runner.temp }}/jouzu-defender.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save Windows npm timings
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-npm-${{ github.job }}-${{ matrix.scope }}
          path: ${{ runner.temp }}/jouzu-npm-logs
          if-no-files-found: warn
          retention-days: 7

  automatic-update:
    needs: release-artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
        scope: [success, rollback]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Windows fixture and npm paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-ci-paths.ps1
        env:
          JOUZU_CI_FIXTURE_DRIVE: ${{ inputs.fixture-drive || 'runner' }}
          JOUZU_CI_NPM_CACHE: ${{ inputs.npm-cache || 'warm' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Restore Windows npm archives
        if: runner.os == 'Windows' && inputs.npm-cache != 'cold'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/jouzu-npm-cache
          key: windows-npm-${{ hashFiles('package-lock.json', 'packages/cli/package-lock.json', 'packages/cli/camoufox-runtime/package-lock.json') }}-${{ github.job }}-${{ matrix.scope }}
          restore-keys: |
            windows-npm-${{ hashFiles('package-lock.json', 'packages/cli/package-lock.json', 'packages/cli/camoufox-runtime/package-lock.json') }}-
            windows-npm-
      - name: Record and configure Windows Defender
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 2
        run: ./scripts/windows-ci-defender.ps1 setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jouzu-updater
          path: dist/ci-artifacts
      - run: npm run test:auto-update
        timeout-minutes: 70
        env:
          JOUZU_UPDATE_SCOPE: ${{ matrix.scope }}
          JOUZU_UPDATE_APPLY_TIMEOUT_MS: ${{ matrix.os == 'windows-latest' && '3600000' || '600000' }}
          JOUZU_UPDATE_CURRENT_TARBALL: dist/ci-artifacts/candidate.tgz
          JOUZU_UPDATE_NEXT_TARBALL: dist/ci-artifacts/next.tgz
          JOUZU_UPDATE_BROKEN_TARBALL: dist/ci-artifacts/broken.tgz
      - name: Remove Windows Defender exclusions
        if: always() && (matrix.os == 'windows-latest')
        shell: pwsh
        timeout-minutes: 2
        run: ./scripts/windows-ci-defender.ps1 cleanup
      - name: Save Windows Defender state
        if: always() && (matrix.os == 'windows-latest')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-defender-automatic-update-${{ matrix.scope }}
          path: ${{ runner.temp }}/jouzu-defender.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save Windows npm timings
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-npm-${{ github.job }}-${{ matrix.scope }}
          path: ${{ runner.temp }}/jouzu-npm-logs
          if-no-files-found: warn
          retention-days: 7

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - run: uv run --project python/jouzu --python ${{ matrix.python }} python -m unittest discover -s python/jouzu/tests -v
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv build --project python/jouzu --out-dir dist/python
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uvx --from twine twine check dist/python/*
