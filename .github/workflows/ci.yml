name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
        exclude:
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
        timeout-minutes: 20
      - run: npm run build
        timeout-minutes: 15
      - run: npm run check
        timeout-minutes: 10
      - run: npm test --workspaces --if-present
        timeout-minutes: 20
      - if: matrix.os == 'windows-latest'
        name: Verify early-failure extension cleanup
        run: node --test packages/cli/test/release-extension-behavior.test.mjs
        timeout-minutes: 5
        env:
          JOUZU_TEST_EXTENSION_EARLY_FAILURE: "1"
      - if: matrix.node == 24
        run: npm run test:extensions:online
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOUZU_EXTENSION_NETWORK: "1"

  legacy-linux-native:
    runs-on: ubuntu-latest
    container: rockylinux:8@sha256:9794037624aaa6212aeada1d28861ef5e0a935adaf93e4ef79837119f2a2d04c
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24"]
    steps:
      - name: Install Git in the minimal baseline image
        run: dnf install -y -q git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify glibc support floor
        run: test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
      - run: npm ci --ignore-scripts
        timeout-minutes: 15
      - run: npm run build
        timeout-minutes: 10
      - name: Load release-owned native dependencies
        run: node --test packages/cli/test/release-extensions.test.mjs
        timeout-minutes: 5
      - name: Degrade when an optional native binding is unavailable
        shell: bash
        run: |
          binding=packages/cli/node_modules/impit/node_modules/impit-linux-x64-gnu/impit-node.linux-x64-gnu.node
          mv "$binding" "$binding.disabled"
          set +e
          PI_OFFLINE=1 node packages/cli/dist/cli.js doctor >doctor.txt 2>&1
          doctor_status=$?
          set -e
          test "$doctor_status" -eq 1
          grep -F "9 selected; 8 ready; 1 optional unavailable" doctor.txt
          grep -F "disabled tools: tff-fetch_url, tff-search_web" doctor.txt
          printf '%s\n' '{"id":"commands","type":"get_commands"}' |
            PI_OFFLINE=1 JOUZU_HOME="$RUNNER_TEMP/jouzu-degraded" \
            node packages/cli/dist/cli.js pi --mode rpc --no-session --no-context-files >rpc.jsonl
          grep -F '"id":"commands"' rpc.jsonl
        timeout-minutes: 5

  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        timeout-minutes: 20
      - run: npm run build
        timeout-minutes: 15
      - run: npm run check
        timeout-minutes: 10
      - run: npm test --workspaces --if-present
        timeout-minutes: 20
      - run: npm run test:extensions:online
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOUZU_EXTENSION_NETWORK: "1"
      - run: npm run pack:prepare:ci
        timeout-minutes: 10
      - run: npm run pack:check
        timeout-minutes: 5
        env:
          JOUZU_PACK_METADATA: dist/ci-artifacts/pack-metadata.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jouzu-candidate
          path: |
            dist/ci-artifacts/candidate.tgz
            dist/ci-artifacts/pack-metadata.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jouzu-updater
          path: |
            dist/ci-artifacts/candidate.tgz
            dist/ci-artifacts/next.tgz
            dist/ci-artifacts/broken.tgz
            dist/ci-artifacts/artifacts.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  packed-install:
    needs: release-artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        scope: [local, npm-exec, global]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jouzu-candidate
          path: dist/ci-artifacts
      - run: npm run test:packed
        timeout-minutes: 35
        env:
          JOUZU_PACKED_SCOPE: ${{ matrix.scope }}
          JOUZU_PACKED_TARBALL: dist/ci-artifacts/candidate.tgz

  automatic-update:
    needs: release-artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        scope: [success, rollback]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jouzu-updater
          path: dist/ci-artifacts
      - run: npm run test:auto-update
        timeout-minutes: 70
        env:
          JOUZU_UPDATE_SCOPE: ${{ matrix.scope }}
          JOUZU_UPDATE_APPLY_TIMEOUT_MS: ${{ matrix.os == 'windows-latest' && '3600000' || '600000' }}
          JOUZU_UPDATE_CURRENT_TARBALL: dist/ci-artifacts/candidate.tgz
          JOUZU_UPDATE_NEXT_TARBALL: dist/ci-artifacts/next.tgz
          JOUZU_UPDATE_BROKEN_TARBALL: dist/ci-artifacts/broken.tgz

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - run: uv run --project python/jouzu --python ${{ matrix.python }} python -m unittest discover -s python/jouzu/tests -v
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv build --project python/jouzu --out-dir dist/python
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uvx --from twine twine check dist/python/*
