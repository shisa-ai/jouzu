name: CI

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to test (all runs the required hosted Linux and macOS suite; windows runs Windows-only hosted tests)
        type: choice
        options: [windows, all]
        default: windows
      npm-cache:
        description: Restore downloaded npm archives (cold skips restoration)
        type: choice
        options: [warm, cold]
        default: warm
      fixture-drive:
        description: Windows fixture volume (runner uses the default temp directory)
        type: choice
        options: [runner, C, D]
        default: runner
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull requests cancel superseded runs. Pushes and dispatches queue per commit, so a later push
  # never cancels another commit's qualification run.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Classifies pushes and pull requests into the required tier or full qualification. Manual runs
    # skip it and run full qualification.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.classify.outputs.full }}
      endurance: ${{ steps.classify.outputs.endurance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          files="$RUNNER_TEMP/changed-files"
          : > "$files"
          if [ "$EVENT" = pull_request ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/files" --jq '.[].filename' > "$files"
          elif [[ "$BEFORE" =~ ^0*$ ]] || ! gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$SHA" --jq '.files[].filename' > "$files" || [ "$(wc -l < "$files")" -ge 300 ]; then
            # A new branch, an unreachable base, or a list at the compare API's 300-file cap has no
            # complete file list, so the push runs full qualification.
            LABELS=full-ci
          fi
          node scripts/ci-changes.mjs "$files" "$LABELS" >> "$GITHUB_OUTPUT"

  node:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Pull requests in the required tier run the canonical Ubuntu/Node 22 suite only.
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || (github.event_name != 'workflow_dispatch' && needs.changes.outputs.full != 'true') && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
        # Linux and macOS test Node 22, the supported minimum: in about 100 main runs, no failure
        # appeared on only one Node version except timing flakes. Windows also tests Node 24, the
        # runtime the Windows launcher bundles.
        node: ${{ fromJSON(inputs.platform == 'windows' && '[22, 24]' || '[22]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record test timings
        shell: bash
        run: |
          echo "JOUZU_TEST_TIMINGS_DIR=$RUNNER_TEMP/test-timings" >> "$GITHUB_ENV"
          echo "JOUZU_TEST_TIMINGS_JOB=node (${{ matrix.os }}, ${{ matrix.node }})" >> "$GITHUB_ENV"
          # Test benchmark run 39336748771: 4 gave the lowest stable suite median on hosted Ubuntu. On macOS
          # (3 CPUs) it failed timing-sensitive tests, so macOS and Windows keep Node's default.
          if [ "$RUNNER_OS" = Linux ]; then echo "JOUZU_TEST_CONCURRENCY=4" >> "$GITHUB_ENV"; fi
      - name: Configure Windows fixture and npm paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-ci-paths.ps1
        env:
          JOUZU_CI_FIXTURE_DRIVE: ${{ inputs.fixture-drive || 'runner' }}
          JOUZU_CI_NPM_CACHE: ${{ inputs.npm-cache || 'warm' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ runner.os != 'Windows' && 'npm' || '' }}
      - name: Restore Windows npm archives
        if: runner.os == 'Windows' && inputs.npm-cache != 'cold'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jouzu-npm-cache/_cacache
          key: windows-npm-${{ hashFiles('package-lock.json', 'packages/cli/package-lock.json', 'packages/cli/camoufox-runtime/package-lock.json') }}-${{ github.job }}-${{ matrix.node }}
          restore-keys: |
            windows-npm-${{ hashFiles('package-lock.json', 'packages/cli/package-lock.json', 'packages/cli/camoufox-runtime/package-lock.json') }}-
            windows-npm-
      - name: Test Windows Defender exclusion handling
        if: matrix.os == 'windows-latest' && matrix.node == 24
        shell: pwsh
        run: |
          ./scripts/windows-ci-paths.test.ps1
          ./scripts/windows-ci-defender.test.ps1
      - name: Record and configure Windows Defender
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 2
        run: ./scripts/windows-ci-defender.ps1 setup
      - run: node scripts/install-source-dependencies.mjs
        timeout-minutes: 20
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: upstream/textguard/source/go.sum
      - run: npm run build
        env:
          JOUZU_BUILD_SOURCE_ONLY: "1"
        timeout-minutes: 15
      - run: npm run check:static
        timeout-minutes: 10
      - run: npm run test:runner
        timeout-minutes: 5
      - run: npm test --workspaces --if-present
        timeout-minutes: 20
        env:
          # 240 s is about twice the slowest test file on CI (~107 s).
          JOUZU_TEST_TIMEOUT_MS: "240000"
          JOUZU_TEST_SUITE_TIMEOUT_MS: "900000"
      - name: Check test duration budgets
        # The budgets in scripts/test-tiers.json are calibrated on this runner. Pull requests warn.
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        shell: bash
        run: npm run test:timings -- budget --tiers scripts/test-tiers.json --where label=jouzu.test ${{ github.event_name == 'pull_request' && '--warn-only' || '' }} "$JOUZU_TEST_TIMINGS_DIR"
      - if: matrix.os == 'windows-latest' && matrix.node == 24
        name: Run production-limit endurance tests
        run: npm run test:endurance --workspace packages/cli
        timeout-minutes: 20
        env:
          JOUZU_TEST_TIMEOUT_MS: "240000"
          JOUZU_TEST_SUITE_TIMEOUT_MS: "900000"
      - if: matrix.os == 'windows-latest'
        name: Verify early-failure extension cleanup
        run: node scripts/run-tests.mjs packages/cli/test/release-extension-behavior.test.mjs
        timeout-minutes: 5
        env:
          JOUZU_TEST_EXTENSION_EARLY_FAILURE: "1"
      - if: matrix.node == 24 || (matrix.os == 'ubuntu-latest' && needs.changes.outputs.full != 'false')
        run: npm run test:extensions:online
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOUZU_EXTENSION_NETWORK: "1"
          JOUZU_TEST_TIMEOUT_MS: "600000"
          JOUZU_TEST_SUITE_TIMEOUT_MS: "900000"
      - name: Save test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-timings-node-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/test-timings
          if-no-files-found: warn
          retention-days: 30
      - name: Remove Windows Defender exclusions
        if: always() && (matrix.os == 'windows-latest')
        shell: pwsh
        timeout-minutes: 2
        run: ./scripts/windows-ci-defender.ps1 cleanup
      - name: Save Windows Defender state
        if: always() && (matrix.os == 'windows-latest')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-defender-node-${{ matrix.node }}
          path: ${{ runner.temp }}/jouzu-defender.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save Windows npm timings
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-npm-${{ github.job }}-${{ matrix.node }}
          path: ${{ runner.temp }}/jouzu-npm-logs
          if-no-files-found: warn
          retention-days: 7

  endurance:
    # Production-limit cases run once per Linux/macOS qualification instead of in every suite, and
    # in the required tier when a change touches flow control.
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'failure' && inputs.platform != 'windows' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.endurance == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record test timings
        shell: bash
        run: |
          echo "JOUZU_TEST_TIMINGS_DIR=$RUNNER_TEMP/test-timings" >> "$GITHUB_ENV"
          echo "JOUZU_TEST_TIMINGS_JOB=endurance" >> "$GITHUB_ENV"
          # Test benchmark run 39336748771: 4 gave the lowest stable suite median on hosted Ubuntu. On macOS
          # (3 CPUs) it failed timing-sensitive tests, so macOS and Windows keep Node's default.
          if [ "$RUNNER_OS" = Linux ]; then echo "JOUZU_TEST_CONCURRENCY=4" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: node scripts/install-source-dependencies.mjs
        timeout-minutes: 20
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: upstream/textguard/source/go.sum
      - run: npm run build
        env:
          JOUZU_BUILD_SOURCE_ONLY: "1"
        timeout-minutes: 15
      - run: npm run test:endurance --workspace packages/cli
        timeout-minutes: 20
        env:
          JOUZU_TEST_TIMEOUT_MS: "240000"
          JOUZU_TEST_SUITE_TIMEOUT_MS: "900000"
      - name: Check test duration budgets
        shell: bash
        run: npm run test:timings -- budget --tiers scripts/test-tiers.json --where label=jouzu.test_endurance ${{ github.event_name == 'pull_request' && '--warn-only' || '' }} "$JOUZU_TEST_TIMINGS_DIR"
      - name: Save test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-timings-endurance
          path: ${{ runner.temp }}/test-timings
          if-no-files-found: warn
          retention-days: 30

  legacy-linux-static-fetch:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'failure' && inputs.platform != 'windows' }}
    runs-on: ubuntu-latest
    container: rockylinux:8@sha256:9794037624aaa6212aeada1d28861ef5e0a935adaf93e4ef79837119f2a2d04c
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.4"]
    steps:
      - name: Install Git in the minimal baseline image
        run: dnf install -y -q git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify glibc support floor
        run: test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
      - run: npm ci --ignore-scripts
        timeout-minutes: 15
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: upstream/textguard/source/go.sum
      - run: npm run build
        timeout-minutes: 10
      - name: Load release-owned dependencies without Camoufox
        run: node scripts/run-tests.mjs packages/cli/test/release-extensions.test.mjs
        timeout-minutes: 5
      - name: Verify optional browser client imports on glibc 2.28
        run: node scripts/test-camoufox-client-import.mjs
        timeout-minutes: 6
      - name: Verify the default installation excludes Camoufox
        shell: bash
        run: |
          test ! -e packages/cli/node_modules/@the-forge-flow/camoufox-pi
          test ! -e packages/cli/node_modules/camoufox-js
          test ! -e packages/cli/node_modules/pi-webaio/node_modules/playwright
          test ! -e packages/cli/node_modules/ua-parser-js
          PI_OFFLINE=1 JOUZU_HOME="$RUNNER_TEMP/jouzu-default" \
            node packages/cli/dist/cli.js doctor --json >doctor.json
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync("doctor.json", "utf8"));
            assert.equal(report.fields.find((field) => field.id === "camoufox.runtime")?.value,
              "not installed; installs on first browser tool use");
          '
        timeout-minutes: 5

  release-artifacts:
    # Package consumers need this job, so they also run only in full qualification.
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'failure' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.full == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        timeout-minutes: 20
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: upstream/textguard/source/go.sum
      - run: npm run build
        timeout-minutes: 15
      - run: npm run check:static
        timeout-minutes: 10
      - run: npm run test:release-metadata
        timeout-minutes: 5
      - run: npm run test:pack-check
        timeout-minutes: 10
      - run: npm run pack:prepare:ci
        timeout-minutes: 10
      - run: npm run pack:check
        timeout-minutes: 5
        env:
          JOUZU_PACK_METADATA: dist/ci-artifacts/pack-metadata.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jouzu-candidate
          path: |
            dist/ci-artifacts/candidate.tgz
            dist/ci-artifacts/pack-metadata.json
            dist/ci-artifacts/release-manifest.json
            dist/ci-artifacts/SHA256SUMS
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jouzu-updater
          path: |
            dist/ci-artifacts/candidate.tgz
            dist/ci-artifacts/next.tgz
            dist/ci-artifacts/broken.tgz
            dist/ci-artifacts/artifacts.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  optional-camoufox:
    needs: release-artifacts
    if: ${{ !cancelled() && needs.release-artifacts.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Windows fixture and npm paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-ci-paths.ps1
        env:
          JOUZU_CI_FIXTURE_DRIVE: ${{ inputs.fixture-drive || 'runner' }}
          JOUZU_CI_NPM_CACHE: ${{ inputs.npm-cache || 'warm' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ runner.os == 'Windows' && '24' || '22' }}
      - name: Restore Windows npm archives
        if: runner.os == 'Windows' && inputs.npm-cache != 'cold'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jouzu-npm-cache/_cacache
          key: windows-npm-${{ hashFiles('package-lock.json', 'packages/cli/package-lock.json', 'packages/cli/camoufox-runtime/package-lock.json') }}-${{ github.job }}-${{ 'default' }}
          restore-keys: |
            windows-npm-${{ hashFiles('package-lock.json', 'packages/cli/package-lock.json', 'packages/cli/camoufox-runtime/package-lock.json') }}-
            windows-npm-
      - name: Record and configure Windows Defender
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 2
        run: ./scripts/windows-ci-defender.ps1 setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jouzu-candidate
          path: dist/ci-artifacts
      - name: Install and exercise the first-use browser runtime
        run: node scripts/test-packed-camoufox.mjs
        timeout-minutes: 25
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOUZU_PACKED_TARBALL: dist/ci-artifacts/candidate.tgz
      - name: Remove Windows Defender exclusions
        if: always() && (matrix.os == 'windows-latest')
        shell: pwsh
        timeout-minutes: 2
        run: ./scripts/windows-ci-defender.ps1 cleanup
      - name: Save Windows Defender state
        if: always() && (matrix.os == 'windows-latest')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-defender-optional-camoufox
          path: ${{ runner.temp }}/jouzu-defender.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save Windows npm timings
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-npm-${{ github.job }}-${{ 'default' }}
          path: ${{ runner.temp }}/jouzu-npm-logs
          if-no-files-found: warn
          retention-days: 7

  packed-install:
    needs: release-artifacts
    if: ${{ !cancelled() && needs.release-artifacts.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || '["ubuntu-latest","macos-latest"]') }}
        # Linux and macOS run every scope in one job; Windows keeps one job per scope.
        scope: ${{ fromJSON(inputs.platform == 'windows' && '["local","npm-exec","global"]' || '["all"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Windows fixture and npm paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-ci-paths.ps1
        env:
          JOUZU_CI_FIXTURE_DRIVE: ${{ inputs.fixture-drive || 'runner' }}
          JOUZU_CI_NPM_CACHE: ${{ inputs.npm-cache || 'warm' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ runner.os == 'Windows' && '24' || '22' }}
      - name: Restore Windows npm archives
        if: runner.os == 'Windows' && inputs.npm-cache != 'cold'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jouzu-npm-cache/_cacache
          key: windows-npm-${{ hashFiles('package-lock.json', 'packages/cli/package-lock.json', 'packages/cli/camoufox-runtime/package-lock.json') }}-${{ github.job }}-${{ matrix.scope }}
          restore-keys: |
            windows-npm-${{ hashFiles('package-lock.json', 'packages/cli/package-lock.json', 'packages/cli/camoufox-runtime/package-lock.json') }}-
            windows-npm-
      - name: Record and configure Windows Defender
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 2
        run: ./scripts/windows-ci-defender.ps1 ${{ matrix.scope == 'global' && 'scanned' || 'setup' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jouzu-candidate
          path: dist/ci-artifacts
      - name: Install from the package (local)
        if: matrix.scope == 'all' || matrix.scope == 'local'
        run: npm run test:packed
        timeout-minutes: 35
        env:
          JOUZU_PACKED_SCOPE: local
          JOUZU_PACKED_TARBALL: dist/ci-artifacts/candidate.tgz
      - name: Install from the package (npm exec)
        if: ${{ !cancelled() && (matrix.scope == 'all' || matrix.scope == 'npm-exec') }}
        run: npm run test:packed
        timeout-minutes: 35
        env:
          JOUZU_PACKED_SCOPE: npm-exec
          JOUZU_PACKED_TARBALL: dist/ci-artifacts/candidate.tgz
      - name: Install from the package (global)
        if: ${{ !cancelled() && (matrix.scope == 'all' || matrix.scope == 'global') }}
        run: npm run test:packed
        timeout-minutes: 35
        env:
          JOUZU_PACKED_SCOPE: global
          JOUZU_PACKED_TARBALL: dist/ci-artifacts/candidate.tgz
      - name: Remove Windows Defender exclusions
        if: always() && (matrix.os == 'windows-latest')
        shell: pwsh
        timeout-minutes: 2
        run: ./scripts/windows-ci-defender.ps1 cleanup
      - name: Save Windows Defender state
        if: always() && (matrix.os == 'windows-latest')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-defender-packed-install-${{ matrix.scope }}
          path: ${{ runner.temp }}/jouzu-defender.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save Windows npm timings
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-npm-${{ github.job }}-${{ matrix.scope }}
          path: ${{ runner.temp }}/jouzu-npm-logs
          if-no-files-found: warn
          retention-days: 7

  automatic-update:
    needs: release-artifacts
    if: ${{ !cancelled() && needs.release-artifacts.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || '["ubuntu-latest","macos-latest"]') }}
        # Linux and macOS run both scopes in one job; Windows keeps one job per scope.
        scope: ${{ fromJSON(inputs.platform == 'windows' && '["success","rollback"]' || '["all"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Windows fixture and npm paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-ci-paths.ps1
        env:
          JOUZU_CI_FIXTURE_DRIVE: ${{ inputs.fixture-drive || 'runner' }}
          JOUZU_CI_NPM_CACHE: ${{ inputs.npm-cache || 'warm' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ runner.os == 'Windows' && '24' || '22' }}
      - name: Restore Windows npm archives
        if: runner.os == 'Windows' && inputs.npm-cache != 'cold'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jouzu-npm-cache/_cacache
          key: windows-npm-${{ hashFiles('package-lock.json', 'packages/cli/package-lock.json', 'packages/cli/camoufox-runtime/package-lock.json') }}-${{ github.job }}-${{ matrix.scope }}
          restore-keys: |
            windows-npm-${{ hashFiles('package-lock.json', 'packages/cli/package-lock.json', 'packages/cli/camoufox-runtime/package-lock.json') }}-
            windows-npm-
      - name: Record and configure Windows Defender
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 2
        run: ./scripts/windows-ci-defender.ps1 setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jouzu-updater
          path: dist/ci-artifacts
      - name: Update to a newer package
        if: matrix.scope == 'all' || matrix.scope == 'success'
        run: npm run test:auto-update
        timeout-minutes: 70
        env:
          JOUZU_UPDATE_SCOPE: success
          JOUZU_UPDATE_APPLY_TIMEOUT_MS: ${{ matrix.os == 'windows-latest' && '3600000' || '600000' }}
          JOUZU_UPDATE_CURRENT_TARBALL: dist/ci-artifacts/candidate.tgz
          JOUZU_UPDATE_NEXT_TARBALL: dist/ci-artifacts/next.tgz
          JOUZU_UPDATE_BROKEN_TARBALL: dist/ci-artifacts/broken.tgz
      - name: Roll back a broken update
        if: ${{ !cancelled() && (matrix.scope == 'all' || matrix.scope == 'rollback') }}
        run: npm run test:auto-update
        timeout-minutes: 70
        env:
          JOUZU_UPDATE_SCOPE: rollback
          JOUZU_UPDATE_APPLY_TIMEOUT_MS: ${{ matrix.os == 'windows-latest' && '3600000' || '600000' }}
          JOUZU_UPDATE_CURRENT_TARBALL: dist/ci-artifacts/candidate.tgz
          JOUZU_UPDATE_NEXT_TARBALL: dist/ci-artifacts/next.tgz
          JOUZU_UPDATE_BROKEN_TARBALL: dist/ci-artifacts/broken.tgz
      - name: Remove Windows Defender exclusions
        if: always() && (matrix.os == 'windows-latest')
        shell: pwsh
        timeout-minutes: 2
        run: ./scripts/windows-ci-defender.ps1 cleanup
      - name: Save Windows Defender state
        if: always() && (matrix.os == 'windows-latest')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-defender-automatic-update-${{ matrix.scope }}
          path: ${{ runner.temp }}/jouzu-defender.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save Windows npm timings
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-npm-${{ github.job }}-${{ matrix.scope }}
          path: ${{ runner.temp }}/jouzu-npm-logs
          if-no-files-found: warn
          retention-days: 7

  published-upgrade:
    needs: release-artifacts
    if: ${{ !cancelled() && needs.release-artifacts.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ runner.os == 'Windows' && '24' || '22' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jouzu-updater
          path: dist/ci-artifacts
      - name: Record Windows Defender state without exclusions
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-ci-defender.ps1 scanned
      - name: Verify published-version update, restart, and rollback
        run: npm run test:auto-update
        timeout-minutes: 60
        env:
          JOUZU_UPDATE_PUBLISHED_VERSION: "0.2.4"
          JOUZU_UPDATE_NEXT_TARBALL: dist/ci-artifacts/candidate.tgz
          JOUZU_UPDATE_BROKEN_TARBALL: dist/ci-artifacts/broken.tgz
          JOUZU_UPDATE_APPLY_TIMEOUT_MS: "900000"
      - name: Check Windows Defender state
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-ci-defender.ps1 cleanup
      - name: Save Windows Defender state
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-defender-published-upgrade
          path: ${{ runner.temp }}/jouzu-defender.json
          if-no-files-found: error
          retention-days: 30

  python:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || (github.event_name != 'workflow_dispatch' && needs.changes.outputs.full != 'true') && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Test Python 3.10
        run: uv run --project python/jouzu --python 3.10 python -m unittest discover -s python/jouzu/tests -v
      - name: Test Python 3.11
        if: ${{ !cancelled() }}
        run: uv run --project python/jouzu --python 3.11 python -m unittest discover -s python/jouzu/tests -v
      - name: Test Python 3.12
        if: ${{ !cancelled() }}
        run: uv run --project python/jouzu --python 3.12 python -m unittest discover -s python/jouzu/tests -v
      - name: Test Python 3.13
        if: ${{ !cancelled() }}
        run: uv run --project python/jouzu --python 3.13 python -m unittest discover -s python/jouzu/tests -v
      - name: Test Python 3.14
        if: ${{ !cancelled() }}
        run: uv run --project python/jouzu --python 3.14 python -m unittest discover -s python/jouzu/tests -v
      - if: matrix.os == 'ubuntu-latest'
        run: uv build --project python/jouzu --out-dir dist/python
      - if: matrix.os == 'ubuntu-latest'
        run: uvx --from twine twine check dist/python/*

  ci-result:
    # The one check for branch protection: every job passed, or was skipped by the required tier or
    # the Windows-only diagnostics.
    if: always()
    needs:
      [
        changes,
        node,
        endurance,
        legacy-linux-static-fetch,
        release-artifacts,
        optional-camoufox,
        packed-install,
        automatic-update,
        published-upgrade,
        python,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          PARTIAL: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'windows' }}
        run: |
          node --input-type=module -e '
            const results = Object.entries(JSON.parse(process.env.RESULTS)).map(([job, value]) => [job, value.result]);
            const allowed = (job, result) =>
              result === "success" || (result === "skipped" && (job === "changes" || process.env.PARTIAL === "true"));
            for (const [job, result] of results) console.log(`${job}: ${result}`);
            const failed = results.filter(([job, result]) => !allowed(job, result));
            if (failed.length) {
              console.error(`Not passed: ${failed.map(([job, result]) => `${job} (${result})`).join(", ")}`);
              process.exit(1);
            }
          '
