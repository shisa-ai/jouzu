name: Track latest Pi release

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-latest
  cancel-in-progress: true

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Compare exact pin with npm latest
        run: node scripts/pi-upstream.mjs latest --require-latest
      - name: Explain update procedure
        if: failure()
        run: |
          {
            echo '## Pi update required'
            echo
            echo 'Run `npm run pi:update`, review the metadata and lock diff, then run `npm run pi:qualify`.'
          } >> "$GITHUB_STEP_SUMMARY"
