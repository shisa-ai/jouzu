name: Native TextGuard

on:
  pull_request:
    paths:
      - "upstream/textguard/**"
      - "scripts/*textguard*"
      - ".github/workflows/textguard-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test deterministic scanner
        working-directory: upstream/textguard/source
        run: go test -mod=vendor . ./internal/... ./cmd/textguard-helper
      - name: Build and verify six locked artifacts
        run: node scripts/build-textguard.mjs
      - name: Execute the native artifact and check distribution contents
        run: node --test scripts/textguard-artifact.test.mjs
