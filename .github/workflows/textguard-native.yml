name: Native TextGuard

on:
  pull_request:
    paths:
      - "upstream/textguard/**"
      - "upstream/pi-content-policy/**"
      - "upstream/pi.lock.json"
      - "scripts/*pi-content-policy*"
      - "scripts/*textguard*"
      - "packages/cli/src/textguard*.ts"
      - "packages/cli/test/textguard*.test.mjs"
      - "packages/cli/src/main-cli.ts"
      - "packages/cli/src/args.ts"
      - "packages/cli/src/model-picker.ts"
      - "packages/cli/src/subagents/**"
      - "packages/cli/package.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/textguard-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.1"
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Test deterministic scanner
        working-directory: upstream/textguard/source
        run: go test -mod=vendor . ./internal/... ./cmd/textguard-helper
      - name: Build and verify six locked artifacts
        run: node scripts/build-textguard.mjs
      - name: Install pinned JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Compile the helper supervisor
        run: |
          node scripts/apply-pi-content-policy.mjs
          npm run build --workspace packages/session-ui
          npx tsc -p packages/cli/tsconfig.json
      - name: Execute the native artifact and supervisor tests
        run: node --test scripts/textguard-artifact.test.mjs packages/cli/test/textguard-native.test.mjs packages/cli/test/textguard-native-queue.test.mjs
