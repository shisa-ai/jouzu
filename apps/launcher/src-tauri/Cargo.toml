[package]
name = "jouzu-launcher"
default-run = "launcher"
version = "0.2.5"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"

semver = "1"
url = "2"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-single-instance = "2.5.4"

# The renderer failure record reads WebView2's own event, which Tauri hands over through with_webview.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", default-features = false }
